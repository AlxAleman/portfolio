<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base target="_top">
<title>QA Data Portal · Interactive demo</title>
<style>
  :root {
    --purple: #3730A3; --purple-2: #6366F1; --purple-bg: #EEF2FF;
    --green: #10B981; --green-a11y: #047857; --green-bg: #ECFDF5;
    --text: #2A2C2E; --grey: #71757B; --grey-light: #F4F4F7; --line: #E3E2E8; --white: #FFFFFF;
    --red: #C12335; --red-bg: #FBE9EB; --amber: #A35400; --amber-bg: #FFF1E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Helvetica, Arial, sans-serif; color: var(--text); background: var(--grey-light); font-size: 14.5px; line-height: 1.45; }
  button, select, input { font: inherit; }
  a { color: var(--purple); }

  .pilot { background: var(--amber-bg); color: var(--amber); text-align: center; font-size: 12.5px; font-weight: 700; padding: 5px 16px; }
  header { background: var(--purple); color: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 58px; gap: 16px; }
  .logo { display: flex; align-items: baseline; gap: 12px; }
  .logo b { font-size: 16px; letter-spacing: .5px; }
  .logo span { color: #C7D2FE; border-left: 1px solid #6366F1; padding-left: 12px; }
  .who { font-size: 13.5px; color: #E0E7FF; }
  nav { background: var(--white); border-bottom: 1px solid var(--line); padding: 0 28px; display: flex; gap: 4px; overflow-x: auto; }
  nav button { border: 0; background: none; padding: 14px 16px; color: var(--text); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button:hover { color: var(--purple); }
  nav button.on { color: var(--purple); font-weight: 700; border-bottom-color: var(--purple); }

  main { padding: 24px 28px 48px; max-width: 1320px; margin: 0 auto; }
  h1 { font-size: 23px; color: var(--purple); margin-bottom: 4px; }
  .sub { color: var(--grey); margin-bottom: 20px; }
  h2 { font-size: 16px; color: var(--purple); margin-bottom: 10px; }
  .muted { color: var(--grey); }
  .small { font-size: 12.5px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .tile { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .tile .lbl { font-size: 12.5px; color: var(--grey); }
  .tile .val { font-size: 24px; font-weight: 700; color: var(--purple); margin-top: 2px; }
  .tile .note { font-size: 12.5px; color: var(--grey); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--purple); color: var(--white); border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14px; text-decoration: none; }
  .btn:hover { background: #312E81; }
  .btn.ghost { background: var(--white); color: var(--purple); border: 1.5px solid var(--purple); }
  .btn.ghost:hover { background: var(--purple-bg); }
  .btn.danger { background: var(--red); }
  .btn.danger:hover { background: #9B1B2A; }
  .btn.sm { padding: 6px 11px; font-size: 13px; }
  .btn[disabled] { background: #A5B4FC; border-color: #A5B4FC; color: var(--white); cursor: not-allowed; }

  .seg { display: inline-flex; border: 1px solid #C9C4D2; border-radius: 6px; overflow: hidden; background: var(--white); }
  .seg button { border: 0; background: var(--white); padding: 7px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #C9C4D2; }
  .seg button.on { background: var(--purple); color: var(--white); font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid #C9C4D2; background: var(--white); border-radius: 14px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--purple); border-color: var(--purple); color: var(--white); font-weight: 700; }
  .chip .c { opacity: .75; margin-left: 4px; }
  select, input[type=date], input[type=text] { border: 1px solid #C9C4D2; border-radius: 6px; padding: 7px 9px; background: var(--white); color: var(--text); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card .name { font-weight: 700; font-size: 16px; color: var(--purple); }
  .card .meta { font-size: 12.5px; color: var(--grey); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; }
  .kv span { color: var(--grey); display: block; font-size: 12px; }
  .card .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
  .pill.ok { background: var(--green-bg); color: var(--green-a11y); }
  .pill.skip { background: var(--grey-light); color: var(--grey); }
  .pill.err { background: var(--red-bg); color: var(--red); }
  .pill.run { background: var(--purple-bg); color: var(--purple); }
  .pill.warn { background: var(--amber-bg); color: var(--amber); }
  .age-warn { color: var(--amber); font-weight: 700; }
  .result { font-size: 12.5px; border-radius: 6px; padding: 7px 10px; background: var(--grey-light); }
  .result.ok { background: var(--green-bg); color: #065F46; }
  .result.err { background: var(--red-bg); color: #7A1320; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--purple-2); border-top-color: transparent; border-radius: 50%; display: inline-block; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .banner { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; margin-bottom: 18px; }
  .dest { border-radius: 10px; padding: 14px 16px; }
  .dest.now { background: var(--purple); color: var(--white); }
  .dest.next { border: 2px dashed var(--purple-2); color: var(--purple); background: var(--white); }
  .dest .k { font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: .6px; }
  .dest .v { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .arrow { color: var(--green-a11y); font-size: 26px; font-weight: 700; text-align: center; }
  .flow { display: grid; grid-template-columns: 1fr 34px 1.25fr 34px 1fr; align-items: stretch; margin-bottom: 12px; }
  .flow .box { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .flow .box h3 { font-size: 13.5px; color: var(--purple); margin-bottom: 6px; }
  .flow .box.engine { background: var(--purple-bg); border-color: #C7D2FE; }
  .flow .box.out { border-left: 4px solid var(--green); }
  .flow .arrow { display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .ex { display: flex; justify-content: space-between; border-bottom: 1px dashed #C7D2FE; padding: 2px 0; }
  .ex:last-child { border-bottom: 0; }

  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .filters label, .fl { display: flex; flex-direction: column; font-size: 12px; color: var(--grey); gap: 4px; }
  .filters select { min-width: 150px; }
  .ms { position: relative; }
  .ms > button { border: 1px solid #C9C4D2; border-radius: 6px; padding: 7px 28px 7px 9px; background: var(--white); min-width: 170px; text-align: left; cursor: pointer; color: var(--text); position: relative; }
  .ms > button::after { content: "▾"; position: absolute; right: 9px; top: 7px; color: var(--grey); }
  .ms .panel-ms { position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--white); border: 1px solid #C9C4D2; border-radius: 8px; box-shadow: 0 8px 24px rgba(55,48,163,.15); z-index: 20; min-width: 230px; max-height: 320px; overflow: auto; padding: 8px; display: none; }
  .ms.open .panel-ms { display: block; }
  .filters .ms .opt, .ms .opt { display: flex; flex-direction: row; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--text); white-space: nowrap; }
  .ms .opt:hover { background: var(--purple-bg); }
  .ms .bar { display: flex; gap: 6px; padding: 4px 6px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .ms .bar button { border: 0; background: none; color: var(--purple); cursor: pointer; font-size: 12.5px; text-decoration: underline; padding: 0; }

  .multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .mini { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .mini .t { font-weight: 700; font-size: 13.5px; }
  .mini .k { font-size: 22px; font-weight: 700; color: var(--purple); }
  .mini svg { display: block; width: 100%; height: auto; margin-top: 4px; }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { background: var(--purple); color: var(--white); text-align: right; padding: 8px 10px; font-weight: 700; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #312E81; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; background: var(--white); }
  tr:nth-child(even) td { background: #FAFAFC; }
  td.total, th.total { font-weight: 700; }
  td .ev { display: block; font-size: 11px; color: var(--grey); font-weight: 400; }
  table.left td, table.left th { text-align: left; }
  table.wrap td { white-space: normal; vertical-align: top; }
  .loading { color: var(--grey); padding: 30px 0; text-align: center; }
  .err-box { background: var(--red-bg); color: #7A1320; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .ok-box { background: var(--green-bg); color: #065F46; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .warn-box { background: var(--amber-bg); color: #6B3A00; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13.5px; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--white); font-size: 12px; padding: 6px 9px; border-radius: 5px; display: none; z-index: 30; white-space: nowrap; }
  code { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; background: var(--purple-bg); color: var(--purple); padding: 1px 5px; border-radius: 3px; }
  .grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  .srclist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .srclist label { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 13.5px; cursor: pointer; }
  .srclist .acc { font-weight: 700; color: var(--purple); margin-top: 6px; font-size: 13px; }

  .busy { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--purple); color: var(--white); border-radius: 24px;
    padding: 10px 18px; display: none; align-items: center; gap: 10px; z-index: 80; box-shadow: 0 8px 24px rgba(55,48,163,.35); font-size: 14px; max-width: 92vw; }
  .busy .spin { border-color: var(--white); border-top-color: transparent; width: 14px; height: 14px; }
  .busy .sec { opacity: .8; font-variant-numeric: tabular-nums; }
  #overlay { position: fixed; inset: 0; background: rgba(255,255,255,.45); cursor: progress; z-index: 75; display: none; }
  .srows { border-top: 1px solid var(--line); }
  .srow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .srow .hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .srow:last-child { border-bottom: 0; }
  .srow .id { font-weight: 700; font-size: 13.5px; }
  .srow .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .srclist .acc input { margin-right: 6px; }
  .inc { display: inline-flex; gap: 6px; align-items: center; border-radius: 14px; padding: 3px 10px; font-size: 12.5px; border: 1px solid #C9C4D2; background: var(--white); color: var(--grey); }
  .inc.on { background: var(--green-bg); border-color: #A7F3D0; color: #065F46; }
  .inc b { font-weight: 700; }
  .inres { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 5px 9px; }
  .inres.yes { background: var(--green-bg); color: var(--green-a11y); }
  .inres.no { background: var(--amber-bg); color: var(--amber); }
  .inres.hid { background: var(--grey-light); color: var(--grey); }
  .ttl { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .ttl h1 { margin: 0; }
  .help-btn { border: 1.5px solid var(--purple); color: var(--purple); background: var(--white); border-radius: 14px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .help-btn:hover { background: var(--purple-bg); }
  #helpShade { position: fixed; inset: 0; background: rgba(42,44,46,.35); z-index: 70; display: none; }
  #help { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--white); z-index: 71; display: none; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.15); }
  #help .hd { background: var(--purple); color: var(--white); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  #help .hd b { font-size: 16px; }
  #help .hd button { background: none; border: 0; color: var(--white); font-size: 22px; cursor: pointer; line-height: 1; }
  #help .bd { padding: 16px 18px 28px; overflow: auto; font-size: 13.5px; }
  #help h3 { font-size: 14px; color: var(--purple); margin: 16px 0 6px; }
  #help h3:first-child { margin-top: 0; }
  #help dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  #help dt { font-weight: 700; white-space: nowrap; }
  #help dd { color: var(--text); }
  #help p { margin-bottom: 6px; }
  td.exp { cursor: pointer; user-select: none; font-weight: 700; color: var(--purple); }
  td.exp:hover { text-decoration: underline; }
  td.exp .car { display: inline-block; width: 14px; color: var(--grey); font-weight: 400; }
  tr.child td { background: #F8FAFF !important; font-size: 12.5px; }
  tr.child td:first-child { padding-left: 32px; color: var(--grey); }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--red); color: var(--white); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; z-index: 85; display: none; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .result.warn { background: var(--amber-bg); color: #6B3A00; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  nav .badge { background: var(--green); color: var(--purple); border-radius: 10px; font-size: 11.5px; font-weight: 700; padding: 1px 7px; margin-left: 6px; }
  .wiz { display: flex; flex-wrap: wrap; margin-bottom: 14px; }
  .wiz div { flex: 1; min-width: 110px; text-align: center; font-size: 12.5px; padding: 8px 4px; border-bottom: 3px solid var(--line); color: var(--grey); }
  .wiz div.on { border-color: var(--purple); color: var(--purple); font-weight: 700; }
  .wiz div.done { border-color: var(--green); color: var(--green-a11y); }
  .choice { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 8px; display: flex; gap: 10px; cursor: pointer; align-items: flex-start; background: var(--white); }
  .choice:hover { border-color: var(--purple-2); }
  .choice.on { border-color: var(--purple); background: var(--purple-bg); }
  .choice b { display: block; }
  .choice .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #94A3B8; flex: none; margin-top: 2px; }
  .choice.on .dot { border-color: var(--purple); background: radial-gradient(var(--purple) 0 4px, transparent 5px); }
  .form label.f { display: block; font-weight: 700; font-size: 13.5px; margin: 14px 0 5px; color: var(--text); }
  .form .hint { font-weight: 400; color: var(--grey); font-size: 12.5px; }
  .form select, .form input[type=text], .form textarea { width: 100%; }
  textarea, input[type=number] { border: 1px solid #C9C4D2; border-radius: 6px; padding: 7px 9px; font: inherit; background: var(--white); color: var(--text); }
  textarea { min-height: 64px; resize: vertical; }
  input:disabled { background: var(--grey-light); color: var(--grey); }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .sugg { display: inline-block; font-size: 12px; color: var(--green-a11y); font-weight: 700; margin-top: 3px; }
  .ex2 { font-size: 12px; color: var(--grey); margin-top: 3px; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .opt-line { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13.5px; cursor: pointer; }
  .tabpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 14px; }
  .top-line { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
  #modalShade { position: fixed; inset: 0; background: rgba(42,44,46,.45); z-index: 65; display: none; align-items: center; justify-content: center; padding: 16px; }
  #modal { background: var(--white); border-radius: 12px; max-width: 680px; width: 100%; padding: 22px; max-height: 90vh; overflow: auto; }
  .who { display: flex; align-items: center; gap: 12px; }
  .viewas { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #E0E7FF; }
  .viewas select { padding: 4px 8px; font-size: 13px; border-radius: 6px; border: 0; }
  .demo-bar { background: var(--amber-bg); color: #6B3A00; font-size: 13px; padding: 7px 28px; display: none; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #F3D9B5; }
  .demo-bar b { color: var(--amber); }
  .inline-load { display: flex; gap: 8px; align-items: center; color: var(--purple); background: var(--purple-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13.5px; }

  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .flow { grid-template-columns: 1fr; }
    .flow .arrow { transform: rotate(90deg); height: 30px; }
    .banner, .grid2, .cols2 { grid-template-columns: 1fr; }
    header { padding: 0 16px; } main { padding: 18px 16px 40px; } nav { padding: 0 16px; }
  }
</style>
</head>
<body>
<div class="pilot">INTERACTIVE DEMO · every company, person and number is fictional · nothing is saved and no email is sent (reload to reset) · try <b>View as → User</b> in the header · <a href="/" style="color:inherit">← back to the portfolio</a></div>
<header>
  <div class="logo"><b>QA Data Portal</b><span>Interactive demo</span><span id="ver" style="border:0;padding:0;font-size:11.5px;opacity:.75"></span></div>
  <div class="who" id="who"></div>
</header>
<div class="demo-bar" id="demoBar"></div>
<nav id="nav"></nav>
<main id="main"><div class="loading"><span class="spin"></span> Loading…</div></main>
<div class="tip" id="tip"></div>
<div class="busy" id="busy" role="status" aria-live="polite"><span class="spin"></span><span class="msg"></span><span class="sec"></span></div>
<div id="overlay"></div>
<div class="toast" id="toast" role="alert"></div>
<div id="modalShade"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="helpShade"></div>
<aside id="help" role="dialog" aria-label="Help"><div class="hd"><b id="helpTitle">Help</b><button id="helpClose" aria-label="Close help">×</button></div><div class="bd" id="helpBody"></div></aside>

<script src="mock.js"></script>
<script>
/* Visible version: change it on every release, so anyone can tell which version they are looking at. */
const PORTAL_VERSION = 'demo';
document.getElementById('ver').textContent = PORTAL_VERSION;

/* ============================================================ server calls */
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e : new Error(String(e))))[fn](...args);
    } else if (window.MOCK && window.MOCK[fn]) {
      setTimeout(() => { Promise.resolve().then(() => window.MOCK[fn](...args)).then(resolve, reject); }, 150);
    } else reject(new Error('Not running inside Apps Script'));
  });
}

/* ============================================================ busy indicator */
// Every action shows that it is working (message + seconds) until it finishes. "block" stops other clicks meanwhile.
let busyTimer = null;
function busyStart(msg, block) {
  const el = document.getElementById('busy');
  el.querySelector('.msg').textContent = msg;
  const sec = el.querySelector('.sec');
  const t0 = Date.now();
  sec.textContent = '0 s';
  clearInterval(busyTimer);
  busyTimer = setInterval(() => { sec.textContent = Math.round((Date.now() - t0) / 1000) + ' s'; }, 1000);
  el.style.display = 'flex';
  document.getElementById('overlay').style.display = block ? 'block' : 'none';
}
function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  el.style.background = ok ? 'var(--green-a11y)' : 'var(--red)';

function busyEnd() {

async function withBusy(msg, block, fn) {

const dayStr = d => new Date(d * 86400000).toISOString().slice(0, 10);
const strDay = s => { const p = s.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); };
function isoWeek(d) {                         // d = days since 1970-01-01
  const dow = (new Date(d * 86400000).getUTCDay() + 6) % 7;
  const monday = d - dow;
  const year = new Date((monday + 3) * 86400000).getUTCFullYear();
  const jan4 = Math.round(Date.UTC(year, 0, 4) / 86400000);
  const jan4Mon = jan4 - ((new Date(jan4 * 86400000).getUTCDay() + 6) % 7);
  return { year: year, week: Math.floor((monday - jan4Mon) / 7) + 1, monday: monday };
}
const weekKey = d => { const w = isoWeek(d); return `${w.year}-W${String(w.week).padStart(2, '0')}`; };
const monthKey = d => dayStr(d).slice(0, 7);

  if (/^\d{4}-\d{2}$/.test(p)) return `${MONTHS[+p.slice(5, 7) - 1]} ${p.slice(0, 4)}`;
  const w = p.match(/^(\d{4})-W(\d{2})$/);
  if (w) { const mon = S.weekMonday[p]; return `W${+w[2]}` + (mon !== undefined ? ` · ${MONTHS[+dayStr(mon).slice(5, 7) - 1]} ${+dayStr(mon).slice(8, 10)}` : ''); }
  return `${MONTHS[+p.slice(5, 7) - 1]} ${+p.slice(8, 10)}`;
}

  rows: { label: 'Evaluations (high → low)', val: s => s.data.rows || 0, dir: -1 },
  age: { label: 'Data age (oldest first)', val: s => (ageOf(s) === null ? 1e9 : ageOf(s)), dir: -1 },
  lastRun: { label: 'Last run (newest first)', val: s => s.lastRun || '', dir: -1 },
  id: { label: 'Source ID', val: s => s.id, dir: 1 },
  lob: { label: 'LOB', val: s => (s.data.lobs || []).join(', ').toLowerCase(), dir: 1 },
  min: { label: 'Data from', val: s => s.data.min || '', dir: 1 },
  max: { label: 'Data to', val: s => s.data.max || '', dir: -1 },
  read: { label: 'Rows read', val: s => (s.lastLoad ? s.lastLoad.read : 0), dir: -1 },
  excluded: { label: 'Excluded', val: s => excludedOf(s) || 0, dir: -1 },
};
const excludedOf = s => (s.lastLoad ? ['noWdid', 'filtered', 'outOfRange', 'badDate', 'badValue', 'dupes', 'conflicts'].reduce((t, k) => t + (Number(s.lastLoad[k]) || 0), 0) : null);
const FILTERS = ['All', 'Loaded', 'Not loaded', 'Needs mapping', 'Error'];
const passFilter = s => S.statusFilter === 'All' || statusOf(s) === S.statusFilter;

function sortedSources() {
  const sort = SORTS[S.sortKey] || SORTS.account;
  return S.status.sources.filter(s => s.active).filter(passFilter).sort((a, b) => {
    const x = sort.val(a), y = sort.val(b);
    return (x < y ? -1 : x > y ? 1 : 0) * S.sortDir;
  });
}

function renderStatus() {

function setSort(k, dir) { S.sortKey = prefs.sortKey = k; S.sortDir = prefs.sortDir = dir; savePrefs(); renderStatus(); }

function pillFor(s) {
  const st = statusOf(s);
  if (st === 'Loading') return '<span class="pill run"><span class="spin"></span> Loading…</span>';

  return st === 'Loaded' ? '<span class="pill ok">✓ Data loaded</span>' : '<span class="pill warn">Data not loaded</span>';
}
function ageText(s) {
  const a = ageOf(s);
  if (a === null) return '—';
  const t = a === 0 ? 'today' : a === 1 ? '1 day ago' : `${a} days ago`;
  return a > STALE_DAYS ? `<span class="age-warn" title="No evaluations in the last ${STALE_DAYS} days">${t}</span>` : t;
}
// Real values from the loaded data; without data, the fixed value of the rule (or "—" if it comes from a column)
const fixedOr = v => (/^\[.*\]$|^\{tab\}$/i.test(String(v || '')) ? '—' : String(v || '—'));
const countriesOf = s => (s.data.countries && s.data.countries.length ? s.data.countries.join(', ') : fixedOr(s.country));
const lobsOf = s => (s.data.lobs && s.data.lobs.length ? s.data.lobs.join(', ') : fixedOr(s.lob));

function runButton(s) {

  const d = s.data || {};

/** Cards view: one card per account. Accounts with one source keep the simple card. */
function groupCards(list) {
  const groups = new Map();
  list.forEach(s => { if (!groups.has(s.account)) groups.set(s.account, []); groups.get(s.account).push(s); });
  return Array.from(groups.values()).map(g => (g.length === 1 ? card(g[0]) : accountCard(g))).join('');
}

function accountCard(g) {
  const rows = g.reduce((t, s) => t + (s.data.rows || 0), 0);
  const mins = g.map(s => s.data.min).filter(Boolean).sort();
  const maxs = g.map(s => s.data.max).filter(Boolean).sort();

  return `<div class="card">

}

async function runOne(id, label) {
  S.running[id] = Date.now(); renderIfStatus();
  busyStart(`${label || 'Loading'} ${id}: reading the file and loading all its 2026 evaluations… (15–75 s)`, false);
  try { S.lastRun[id] = await call('apiRun', id); }
  catch (e) { S.lastRun[id] = { status: 'ERROR', message: e.message, stats: {} }; toast(`${id}: ${e.message}`); }
  busyMsg(`${id}: done. Refreshing the totals…`);
  delete S.running[id];
  try { await loadStatus(); } finally { busyEnd(); }
  renderIfStatus();
}

/* ============================================================ RESULTS */
function indexDataset() {
  const ds = S.ds, c = ds.cols;
  const years = new Set(), months = {}, weeks = {}, triples = new Set();
  S.weekMonday = {};
  let minD = Infinity, maxD = -Infinity;
  for (let i = 0; i < c.d.length; i++) {
    const d = c.d[i];
    const y = +dayStr(d).slice(0, 4);
    years.add(y);
    (months[y] = months[y] || new Set()).add(monthKey(d));
    const w = isoWeek(d), wk = weekKey(d);
    (weeks[w.year] = weeks[w.year] || new Set()).add(wk);
    S.weekMonday[wk] = w.monday;
    triples.add(c.a[i] + '|' + c.c[i] + '|' + c.l[i]);
    if (d < minD) minD = d; if (d > maxD) maxD = d;
  }
  ds.meta = { years: Array.from(years).sort(), months: months, weeks: weeks,
    triples: Array.from(triples).map(t => t.split('|').map(Number)), minD: minD, maxD: maxD };
  if (!S.r) {
    const year = ds.meta.years.length ? ds.meta.years[ds.meta.years.length - 1] : new Date().getFullYear();
    S.r = { mode: 'month', year: year, months: null, weeks: null, from: isFinite(minD) ? dayStr(minD) : '', to: isFinite(maxD) ? dayStr(maxD) : '',
      grain: 'month', countries: null, accounts: null, lobs: null };   // facet sets: null = all
  }
}

    <p class="sub">QA = sum of numerators ÷ sum of denominators of every evaluation in the period. Filters apply instantly.</p>
    <div id="res"><div class="loading"><span class="spin"></span> Loading the data (first time only)…</div></div>`;
  const needLoad = !(S.ds && S.dsVersion === S.status.dataVersion);
  if (needLoad) busyStart('Loading the evaluations (only the first time or after the data changes)…', false);
  try { await ensureDataset(); } catch (e) { busyEnd(); document.getElementById('res').innerHTML = `<div class="err-box">${esc(e.message)}</div>`; return; }
  if (needLoad) busyEnd();
  if (S.view !== 'results') return;

/**
 * Hierarchical filters Country > Account > LOB: the accounts offered depend on the selected countries,
 * and the LOBs on the selected countries and accounts. Each facet: null = all, Set = chosen values.
 */
function facetOptions() {
  const D = S.ds.dict, r = S.r, T = S.ds.meta.triples;
  const inSet = (set, name) => !set || set.has(name);
  const countries = Array.from(new Set(T.map(t => D.cty[t[1]]))).sort();
  const accounts = Array.from(new Set(T.filter(t => inSet(r.countries, D.cty[t[1]])).map(t => D.acc[t[0]]))).sort();
  const lobs = Array.from(new Set(T.filter(t => inSet(r.countries, D.cty[t[1]]) && inSet(r.accounts, D.acc[t[0]])).map(t => D.lob[t[2]]))).sort();
  return { countries: countries, accounts: accounts, lobs: lobs };
}

/** Drops chosen values that are no longer offered (an upper filter changed). Empty → back to "all". */
function pruneFacet(key, avail) {
  const set = S.r[key];
  if (!set) return;
  Array.from(set).forEach(v => { if (!avail.includes(v)) set.delete(v); });
  if (!set.size || set.size === avail.length) S.r[key] = null;
}

function drawResultsView() {
  const r = S.r, meta = S.ds.meta;
  let opt = facetOptions();
  pruneFacet('countries', opt.countries);
  opt = facetOptions();
  pruneFacet('accounts', opt.accounts);
  opt = facetOptions();
  pruneFacet('lobs', opt.lobs);
  const monthsAvail = Array.from(meta.months[r.year] || []).sort();
  const weeksAvail = Array.from(meta.weeks[r.year] || []).sort();
  if (!r.months) r.months = new Set(monthsAvail);
  if (!r.weeks) r.weeks = new Set(weeksAvail);
  const sel = (id, label, list, val, all) => `<label>${label}<select id="${id}"><option value="">${all}</option>${list.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
  const msText = (set, avail, word) => (set.size === avail.length ? `All ${word} (${avail.length})` : set.size === 0 ? `No ${word}` : set.size <= 3 ? Array.from(set).sort().map(periodLabel).join(', ') : `${set.size} ${word} selected`);
  const multi = (id, label, avail, set, word) => `<div class="fl">${label}<div class="ms" id="${id}"><button type="button">${esc(msText(set, avail, word))}</button>
    <div class="panel-ms"><div class="bar"><button data-all>Select all</button><button data-none>Clear</button></div>
    ${avail.map(p => `<label class="opt"><input type="checkbox" value="${p}" ${set.has(p) ? 'checked' : ''}> ${esc(periodLabel(p))}</label>`).join('')}</div></div></div>`;
  const facetText = (set, avail, word) => (!set ? `All ${word} (${avail.length})` : set.size === 0 ? `No ${word}` : set.size <= 2 ? Array.from(set).sort().join(', ') : `${set.size} ${word} selected`);
  const facet = (id, label, avail, set, word) => `<div class="fl">${label}<div class="ms" id="${id}"><button type="button" title="${esc(set ? Array.from(set).sort().join(', ') : 'All')}">${esc(facetText(set, avail, word))}</button>
    <div class="panel-ms"><div class="bar"><button data-all>Select all</button><button data-none>Clear</button></div>
    ${avail.map(v => `<label class="opt"><input type="checkbox" value="${esc(v)}" ${!set || set.has(v) ? 'checked' : ''}> ${esc(v)}</label>`).join('')}</div></div></div>`;
  document.getElementById('res').innerHTML = `
    <div class="filters">
      <div class="fl">Period<span class="seg"><button data-mode="month" class="${r.mode === 'month' ? 'on' : ''}">Month</button><button data-mode="week" class="${r.mode === 'week' ? 'on' : ''}">Week</button><button data-mode="range" class="${r.mode === 'range' ? 'on' : ''}">Specific range</button></span></div>
      ${r.mode !== 'range' ? `<label>Year<select id="f-year">${meta.years.map(y => `<option ${y === r.year ? 'selected' : ''}>${y}</option>`).join('')}</select></label>` : ''}
      ${r.mode === 'month' ? multi('ms-month', 'Months', monthsAvail, r.months, 'months') : ''}
      ${r.mode === 'week' ? multi('ms-week', 'Weeks', weeksAvail, r.weeks, 'weeks') : ''}
      ${r.mode === 'range' ? `<label>From<input type="date" id="f-from" value="${esc(r.from)}"></label><label>To<input type="date" id="f-to" value="${esc(r.to)}"></label>
        <label>Group by<select id="f-grain">${['day', 'week', 'month'].map(g => `<option value="${g}" ${r.grain === g ? 'selected' : ''}>${g[0].toUpperCase() + g.slice(1)}</option>`).join('')}</select></label>` : ''}
      ${facet('ms-cty', 'Country', opt.countries, r.countries, 'countries')}
      ${facet('ms-acc', 'Account', opt.accounts, r.accounts, 'accounts')}
      ${facet('ms-lob', 'LOB', opt.lobs, r.lobs, 'LOBs')}
      <button class="btn ghost sm" id="f-reset">Reset</button>
    </div>
    <div id="res-body"></div>`;
  const redraw = () => drawResultsView();
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { r.mode = b.dataset.mode; redraw(); });
  const fy = document.getElementById('f-year');
  if (fy) fy.onchange = e => { r.year = +e.target.value; r.months = null; r.weeks = null; redraw(); };
  const ff = document.getElementById('f-from'); if (ff) ff.onchange = e => { r.from = e.target.value; redraw(); };
  const ft = document.getElementById('f-to'); if (ft) ft.onchange = e => { r.to = e.target.value; redraw(); };
  const fg = document.getElementById('f-grain'); if (fg) fg.onchange = e => { r.grain = e.target.value; redraw(); };
  bindFacet('ms-cty', 'countries', opt.countries, redraw);
  bindFacet('ms-acc', 'accounts', opt.accounts, redraw);
  bindFacet('ms-lob', 'lobs', opt.lobs, redraw);
  document.getElementById('f-reset').onclick = () => { S.r = null; indexDataset(); redraw(); };
  bindMulti('ms-month', r.months, monthsAvail, redraw);
  bindMulti('ms-week', r.weeks, weeksAvail, redraw);
  drawResultsBody(compute());
}

function bindMulti(id, set, avail, redraw) {
  const el = document.getElementById(id);
  if (!el) return;
  el.querySelector(':scope > button').onclick = e => { e.stopPropagation(); el.classList.toggle('open'); };
  el.querySelector('[data-all]').onclick = e => { e.stopPropagation(); avail.forEach(p => set.add(p)); redraw(); reopen(id); };
  el.querySelector('[data-none]').onclick = e => { e.stopPropagation(); set.clear(); redraw(); reopen(id); };
  el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { cb.checked ? set.add(cb.value) : set.delete(cb.value); redraw(); reopen(id); });
}
/** Multi-select over a facet (null = all). */
function bindFacet(id, key, avail, redraw) {
  const el = document.getElementById(id);
  if (!el) return;
  el.querySelector(':scope > button').onclick = e => { e.stopPropagation(); el.classList.toggle('open'); };
  el.querySelector('[data-all]').onclick = e => { e.stopPropagation(); S.r[key] = null; redraw(); reopen(id); };
  el.querySelector('[data-none]').onclick = e => { e.stopPropagation(); S.r[key] = new Set(); redraw(); reopen(id); };
  el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const set = S.r[key] ? S.r[key] : new Set(avail);
    cb.checked ? set.add(cb.value) : set.delete(cb.value);
    S.r[key] = set.size === avail.length ? null : set;
    redraw(); reopen(id);
  });
}
function reopen(id) { const el = document.getElementById(id); if (el) el.classList.add('open'); }

/** Weighted aggregation in the browser: one pass over the compact dataset. */
function compute() {
  const r = S.r, ds = S.ds, c = ds.cols, D = ds.dict;
  const idxSet = (set, dict) => (set ? new Set(Array.from(set).map(v => dict.indexOf(v))) : null);
  const sa = idxSet(r.accounts, D.acc), sc = idxSet(r.countries, D.cty), sl = idxSet(r.lobs, D.lob);
  const oneAccount = r.accounts && r.accounts.size === 1;
  const bySource = {};
  const fromD = r.mode === 'range' && r.from ? strDay(r.from) : -Infinity;
  const toD = r.mode === 'range' && r.to ? strDay(r.to) : Infinity;
  const keyOf = d => (r.mode === 'month' ? monthKey(d) : r.mode === 'week' ? weekKey(d)
    : r.grain === 'month' ? monthKey(d) : r.grain === 'week' ? weekKey(d) : dayStr(d));
  const rows = new Map(), subs = new Map(), periods = new Set(), agents = new Set(), accounts = new Set();
  let tn = 0, tm = 0, te = 0;
  for (let i = 0; i < c.d.length; i++) {
    if (sa && !sa.has(c.a[i])) continue;
    if (sc && !sc.has(c.c[i])) continue;
    if (sl && !sl.has(c.l[i])) continue;
    const d = c.d[i];
    if (r.mode === 'month') { if (!r.months.has(monthKey(d))) continue; }
    else if (r.mode === 'week') { if (!r.weeks.has(weekKey(d))) continue; }
    else if (d < fromD || d > toD) continue;
    const p = keyOf(d);
    if (r.mode === 'range' && r.grain === 'week') S.weekMonday[p] = isoWeek(d).monday;
    periods.add(p);
    const label = oneAccount ? `${D.lob[c.l[i]]} · ${D.cty[c.c[i]]}` : D.acc[c.a[i]];
    const sid = D.src[c.s[i]];
    bySource[sid] = (bySource[sid] || 0) + 1;
    const add = (map, key) => {
      let row = map.get(key);
      if (!row) { row = { label: key, n: 0, m: 0, e: 0, ag: new Set(), cells: {} }; map.set(key, row); }
      row.n += c.n[i]; row.m += c.m[i]; row.e++; row.ag.add(c.w[i]);
      const cell = row.cells[p] || (row.cells[p] = { n: 0, m: 0, e: 0 });
      cell.n += c.n[i]; cell.m += c.m[i]; cell.e++;
    };
    add(rows, label);
    if (!oneAccount) {                                   // drill-down: the account's LOBs
      if (!subs.has(label)) subs.set(label, new Map());
      add(subs.get(label), `${D.lob[c.l[i]]} · ${D.cty[c.c[i]]}`);
    }
    tn += c.n[i]; tm += c.m[i]; te++; agents.add(c.a[i] + '|' + c.w[i]); accounts.add(c.a[i]);
  }
  const ps = Array.from(periods).sort();
  const shape = x => ({
    label: x.label, kpi: x.m ? x.n / x.m : null, evals: x.e, agents: x.ag.size,
    cells: ps.map(p => (x.cells[p] ? { kpi: x.cells[p].m ? x.cells[p].n / x.cells[p].m : null, evals: x.cells[p].e } : null)) });
  const sub = {};
  subs.forEach((m, acc) => { sub[acc] = Array.from(m.values()).map(shape); });
  return {
    periods: ps, sub: sub,
    rows: Array.from(rows.values()).sort((a, b) => a.label.localeCompare(b.label)).map(shape),
    overall: { kpi: tm ? tn / tm : null, evals: te, agents: agents.size, accounts: accounts.size },
    bySource: bySource, oneAccount: oneAccount,
  };
}

function periodScopeText() {
  const r = S.r;
  if (r.mode === 'range') return `${r.from || '…'} → ${r.to || '…'} · by ${r.grain}`;
  const set = r.mode === 'month' ? r.months : r.weeks;
  return `${set.size} ${r.mode}${set.size === 1 ? '' : 's'} of ${r.year}`;
}

/** Table sort: by name, by one period or by Total; high → low first, click again for low → high. */
function sortRows(res, list) {
  const rs = S.rsort || { key: 'label', dir: 1 };
  const pi = res.periods.indexOf(rs.key);
  const val = x => (rs.key === 'label' ? x.label.toLowerCase() : rs.key === 'total' ? x.kpi : pi >= 0 && x.cells[pi] ? x.cells[pi].kpi : null);
  return (list || res.rows).slice().sort((a, b) => {
    const x = val(a), y = val(b);
    if (x === null && y === null) return a.label.localeCompare(b.label);
    if (x === null) return 1;                                  // rows without data in that column go last
    if (y === null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * rs.dir || a.label.localeCompare(b.label);
  });
}

function drawResultsBody(res) {
  S.lastRes = res;
  const box = document.getElementById('res-body');
  if (!res.rows.length) { box.innerHTML = '<div class="panel muted">No evaluations for these filters.</div>'; return; }
  const all = [];
  res.rows.forEach(x => x.cells.forEach(c => { if (c && c.kpi !== null) all.push(c.kpi); }));
  const lo = Math.max(0, Math.floor((Math.min.apply(null, all) * 100 - 5) / 10) * 10) / 100;
  const r = S.r;
  const scope = res.oneAccount ? `${esc(Array.from(r.accounts)[0])} by LOB · country` : 'by account';
  const unit = r.mode === 'range' ? r.grain : r.mode;
  box.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="lbl">QA score (weighted)</div><div class="val">${pct(res.overall.kpi)}</div><div class="note">${esc(periodScopeText())}</div></div>
      <div class="tile"><div class="lbl">Evaluations</div><div class="val">${N(res.overall.evals)}</div><div class="note">in the selection</div></div>
      <div class="tile"><div class="lbl">Agents evaluated</div><div class="val">${N(res.overall.agents)}</div><div class="note">unique WDIDs</div></div>
      <div class="tile"><div class="lbl">Accounts</div><div class="val">${N(res.overall.accounts)}</div><div class="note">with data in the selection</div></div>
    </div>
    <h2>Trend ${scope}</h2>
    <div class="multiples">${res.rows.map(x => mini(x, res.periods, lo)).join('')}</div>
    <h2>QA score per ${unit} ${scope}</h2>
    <div class="tbl-wrap"><table>
      <tr>${rth('label', res.oneAccount ? 'LOB · country' : 'Account')}${res.periods.map(p => rth(p, esc(periodLabel(p)))).join('')}${rth('total', 'Total', 'total')}</tr>
      ${sortRows(res).map(x => {
        const kids = !res.oneAccount && res.sub[x.label] ? res.sub[x.label] : null;
        const open = kids && S.expanded.has(x.label);
        const first = kids ? `<td class="exp" data-exp="${esc(x.label)}" title="${open ? 'Hide' : 'Show'} the LOBs of this account"><span class="car">${open ? '▾' : '▸'}</span>${esc(x.label)}</td>` : `<td>${esc(x.label)}</td>`;
        return resultRow(x, first, '') + (open ? sortRows(res, kids).map(k => resultRow(k, `<td>${esc(k.label)}</td>`, 'child')).join('') : '');
      }).join('')}
    </table></div>
    <p class="small muted" style="margin-top:8px">Click an account to show or hide its LOBs. Click a column to sort (high → low, click again for low → high). Small numbers = evaluations. Totals use all their evaluations, not an average of the periods.</p>`;
  box.querySelectorAll('[data-exp]').forEach(td => td.onclick = () => {
    const k = td.dataset.exp;
    S.expanded.has(k) ? S.expanded.delete(k) : S.expanded.add(k);
    drawResultsBody(S.lastRes);
  });
  box.querySelectorAll('[data-rsort]').forEach(th => th.onclick = () => {
    const k = th.dataset.rsort;
    const cur = S.rsort || { key: 'label', dir: 1 };
    S.rsort = cur.key === k ? { key: k, dir: -cur.dir } : { key: k, dir: k === 'label' ? 1 : -1 };
    drawResultsBody(S.lastRes);
  });
  bindTips();
}

/** One row of the Results table (an account, or one of its LOBs when expanded). */
function resultRow(x, firstCell, cls) {
  return `<tr class="${cls}">${firstCell}${x.cells.map(c => c ? `<td title="${c.evals} evaluations">${pct(c.kpi)}<span class="ev">${N(c.evals)}</span></td>` : '<td class="muted">—</td>').join('')}
    <td class="total">${pct(x.kpi)}<span class="ev">${N(x.evals)} evals · ${N(x.agents)} agents</span></td></tr>`;
}

/** Sortable header cell of the Results table. */
function rth(key, label, cls) {
  const rs = S.rsort || { key: 'label', dir: 1 };
  const arrow = rs.key === key ? (rs.dir > 0 ? ' ▲' : ' ▼') : '';
  return `<th class="sortable ${cls || ''}" data-rsort="${esc(key)}" title="Sort by this column">${label}${arrow}</th>`;
}

/** One series per card (small multiples): one hue, shared scale across cards. */
function mini(x, periods, lo) {
  const W = 260, H = 96, pl = 30, pr = 8, pt = 8, pb = 18;
  const pts = x.cells.map((c, i) => (c && c.kpi !== null ? { i: i, k: c.kpi, e: c.evals } : null));
  const xs = i => pl + (periods.length > 1 ? (i * (W - pl - pr)) / (periods.length - 1) : (W - pl - pr) / 2);
  const ys = k => pt + (H - pt - pb) * (1 - (Math.min(k, 1) - lo) / (1 - lo || 1));
  let path = '';
  pts.forEach((p, j) => { if (!p) return; path += (j && pts[j - 1] ? 'L' : 'M') + xs(p.i).toFixed(1) + ',' + ys(p.k).toFixed(1); });
  const grid = [lo, (lo + 1) / 2, 1].map(g => `<line x1="${pl}" x2="${W - pr}" y1="${ys(g)}" y2="${ys(g)}" stroke="#E5E7EB"/><text x="${pl - 4}" y="${ys(g) + 3}" font-size="9" fill="#71757B" text-anchor="end">${Math.round(g * 100)}%</text>`).join('');
  const r = periods.length > 30 ? 2.5 : 4;
  const dots = pts.filter(Boolean).map(p => `<circle cx="${xs(p.i)}" cy="${ys(p.k)}" r="${r}" fill="#3730A3" stroke="#fff" stroke-width="${r > 3 ? 2 : 1}"/>` +
    `<circle cx="${xs(p.i)}" cy="${ys(p.k)}" r="10" fill="transparent" data-tip="${esc(periodLabel(periods[p.i]))}: ${pct(p.k)} · ${p.e} evaluations"/>`).join('');
  const first = periods.length ? `<text x="${pl}" y="${H - 4}" font-size="9" fill="#71757B">${esc(periodLabel(periods[0]))}</text>` : '';
  const last = periods.length > 1 ? `<text x="${W - pr}" y="${H - 4}" font-size="9" fill="#71757B" text-anchor="end">${esc(periodLabel(periods[periods.length - 1]))}</text>` : '';
  return `<div class="mini"><div class="t">${esc(x.label)}</div><div class="k">${pct(x.kpi)} <span class="muted small" style="font-weight:400">${N(x.evals)} evals</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="QA trend for ${esc(x.label)}">${grid}<path d="${path}" fill="none" stroke="#3730A3" stroke-width="2" stroke-linejoin="round"/>${dots}${first}${last}</svg></div>`;
}

function bindTips() {
  const tip = document.getElementById('tip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.onmousemove = e => { tip.style.display = 'block'; tip.textContent = el.getAttribute('data-tip'); tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px'; };
    el.onmouseleave = () => { tip.style.display = 'none'; };
  });
}

/* ============================================================ MANAGE DATA */
async function renderManage() {
  if (!S.status) { renderStatus(); return; }
  const m = S.del;
  // Only sources with loaded data can be deleted
  const srcs = S.status.sources.filter(s => s.data && s.data.rows);
  Array.from(m.sources).forEach(id => { if (!srcs.some(s => s.id === id)) m.sources.delete(id); });
  const totalLoaded = srcs.reduce((t, s) => t + s.data.rows, 0);
  const byAcc = {};
  srcs.forEach(s => { (byAcc[s.account] = byAcc[s.account] || []).push(s); });
  const ready = m.preview && m.preview.total > 0 && m.confirm === 'DELETE';
  $main.innerHTML = `
    <div class="ttl"><h1>Manage data</h1><button class="help-btn" data-help title="What does everything on this page mean?">? Help</button></div>
    <p class="sub">Delete loaded evaluations by source and date range, or everything. Deleted rows are kept in a backup for 7 days and can be restored.</p>
    <div class="warn-box">⚠ The account files are the source of truth: if you press <b>Load data</b> or <b>Refresh</b> on a source after deleting, its rows are loaded again from the file. This page is for the BA team; users ask for deletions in <b>Requests</b> and an Admin approves them.</div>
    ${m.msg ? `<div class="${m.msgErr ? 'err-box' : 'ok-box'}">${esc(m.msg)}</div>` : ''}
    <div class="grid2">
      <div class="panel">
        <h2>1 · What to delete</h2>
        <div class="toolbar"><span class="seg"><button data-scope="all" class="${m.allSources ? 'on' : ''}">All sources</button><button data-scope="some" class="${m.allSources ? '' : 'on'}">Choose sources</button></span></div>
        ${!srcs.length ? '<p class="muted">There is no loaded data to delete.</p>' : m.allSources ? `<p class="small muted">All ${srcs.length} sources with data · ${N(totalLoaded)} evaluations.</p>` : `<div class="srclist">${Object.keys(byAcc).sort().map(a => `<label class="acc"><input type="checkbox" data-acc="${esc(a)}" ${byAcc[a].every(s => m.sources.has(s.id)) ? 'checked' : ''}>${esc(a)} <span class="muted small" style="font-weight:400">(whole account)</span></label>` +
          byAcc[a].map(s => `<label style="padding-left:22px"><input type="checkbox" data-src="${esc(s.id)}" ${m.sources.has(s.id) ? 'checked' : ''}> ${esc(s.id)} <span class="muted small">(${N(s.data.rows)} evaluations)</span></label>`).join('')).join('')}</div>`}
        <h2 style="margin-top:16px">2 · Which dates</h2>
        <div class="toolbar"><span class="seg"><button data-dm="all" class="${m.datesMode === 'all' ? 'on' : ''}">All dates</button><button data-dm="range" class="${m.datesMode === 'range' ? 'on' : ''}">Date range</button></span>
          ${m.datesMode === 'range' ? `<label class="fl">From<input type="date" id="d-from" value="${esc(m.from)}"></label><label class="fl">To<input type="date" id="d-to" value="${esc(m.to)}"></label>` : ''}</div>
        <button class="btn ghost" id="d-preview">Preview what will be deleted</button>
      </div>
      <div class="panel">
        <h2>3 · Confirm</h2>
        ${m.previewLoading ? '<div class="inline-load"><span class="spin"></span> Counting the evaluations that match… please wait.</div>' : ''}
        ${m.preview ? `<p><b>${N(m.preview.total)}</b> evaluations will be deleted · ${N(m.preview.remaining)} will remain.</p>
          ${m.preview.total ? `<div class="tbl-wrap" style="margin:8px 0 12px"><table class="left"><tr><th>Source</th><th>Rows</th></tr>${Object.keys(m.preview.bySource).sort().map(k => `<tr><td>${esc(k)}</td><td>${N(m.preview.bySource[k])}</td></tr>`).join('')}</table></div>` : ''}`
          : m.previewLoading ? '' : '<p class="muted small">Step 1: choose what to delete. Step 2: press “Preview”. Step 3: type DELETE and press Delete.</p>'}
        <label class="fl" style="margin-bottom:8px">Reason (optional)<input type="text" id="d-reason" value="${esc(m.reason)}" placeholder="e.g. wrong file loaded for September"></label>
        <label class="fl" style="margin-bottom:12px"><span>Type <b>DELETE</b> to confirm</span><input type="text" id="d-confirm" value="${esc(m.confirm)}" autocomplete="off"></label>
        <button class="btn danger" id="d-go" ${ready ? '' : 'disabled'}>Delete ${m.preview && m.preview.total ? N(m.preview.total) + ' evaluations' : ''}</button>
      </div>
    </div>
    ${removePanel()}
    <h2>Deletion history</h2>
    <div id="d-hist"><div class="loading"><span class="spin"></span> Loading…</div></div>`;
  const resetPreview = () => { m.preview = null; m.confirm = ''; };
  document.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { m.allSources = b.dataset.scope === 'all'; resetPreview(); renderManage(); });
  document.querySelectorAll('[data-dm]').forEach(b => b.onclick = () => { m.datesMode = b.dataset.dm; resetPreview(); renderManage(); });
  document.querySelectorAll('[data-src]').forEach(cb => cb.onchange = () => { cb.checked ? m.sources.add(cb.dataset.src) : m.sources.delete(cb.dataset.src); resetPreview(); renderManage(); });
  document.querySelectorAll('[data-acc]').forEach(cb => cb.onchange = () => {
    (byAcc[cb.dataset.acc] || []).forEach(s => (cb.checked ? m.sources.add(s.id) : m.sources.delete(s.id)));
    resetPreview(); renderManage();
  });
  const df = document.getElementById('d-from'); if (df) df.onchange = e => { m.from = e.target.value; resetPreview(); renderManage(); };
  const dt = document.getElementById('d-to'); if (dt) dt.onchange = e => { m.to = e.target.value; resetPreview(); renderManage(); };
  document.getElementById('d-reason').oninput = e => { m.reason = e.target.value; };
  document.getElementById('d-confirm').oninput = e => { m.confirm = e.target.value.trim(); document.getElementById('d-go').disabled = !(m.preview && m.preview.total > 0 && m.confirm === 'DELETE'); };
  document.getElementById('d-preview').onclick = async () => {
    const q = deleteQuery();
    if (q.error) { m.msg = q.error; m.msgErr = true; renderManage(); return; }
    m.msg = ''; m.preview = null; m.previewLoading = true; renderManage();
    await withBusy('Counting the evaluations that match…', true, async () => {
      try { m.preview = await call('apiDeletePreview', q); } catch (e) { m.preview = null; m.msg = e.message; m.msgErr = true; }
    });
    m.previewLoading = false; renderManage();
    const c = document.getElementById('d-confirm'); if (c && m.preview && m.preview.total) c.focus();
  };
  document.getElementById('d-go').onclick = async () => {
    const q = deleteQuery(); q.confirm = 'DELETE'; q.reason = m.reason;
    const n = m.preview ? m.preview.total : 0;
    const btn = document.getElementById('d-go'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Deleting…';
    await withBusy(`Deleting ${N(n)} evaluations and saving the 7-day backup… keep this page open.`, true, async () => {
      try {
        const res = await call('apiDelete', q);
        m.msg = res.rows ? `✓ Done: deleted ${res.rows.toLocaleString('en-US')} evaluations (batch ${res.batchId}). You can restore them below for 7 days.` : 'Nothing matched: no rows were deleted.';
        m.msgErr = false;
      } catch (e) { m.msg = e.message; m.msgErr = true; }
      busyMsg('Refreshing the totals…');
      m.preview = null; m.confirm = ''; m.reason = '';
      await loadStatus();
    });
    renderManage();
    window.scrollTo(0, 0);
  };
  bindRemove();
  loadHistory();
}

/* Remove a source: deletes its data (7-day backup), then unticks Active in Config. Admin only. */

/** Closest header to a missing column name (same words, contained, or few letters different). */
function similarity(a, b) {
  const n = s => String(s || '').toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim();
  a = n(a); b = n(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.9;
  const ta = new Set(a.split(' ')), tb = new Set(b.split(' '));
  let both = 0; ta.forEach(t => { if (tb.has(t)) both++; });
  const jac = both / (ta.size + tb.size - both);
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return Math.max(jac, 1 - d[a.length][b.length] / Math.max(a.length, b.length));
}
function bestMatch(spec, headers) {
  let best = '', score = 0;
  String(spec).split('||').forEach(alias => headers.forEach(h => { const s = similarity(alias, h); if (s > score) { score = s; best = h; } }));
  return score >= 0.5 ? best : '';
}

/** Reasons a row is left out: key in the test stats, label, meaning and what to do. */

  ['noWdid', 'No WDID', 'The WDID is empty or says N/A, so the evaluation cannot be assigned to an agent. Fill the WDID in the file.'],
  ['filtered', 'Excluded by your rule', 'Matches a rule in “Rows that should not count” (e.g. calibrations). Nothing to fix if that is intended.'],
  ['badDate', 'Unreadable date', 'The date is empty or not a date. Check the date column, or choose month-first / day-first in step 4.'],
  ['outOfRange', 'Outside 2026', 'The pilot only loads evaluations of 2026.'],
  ['badValue', 'Score is not a number', 'The score is empty or text (e.g. stars, words, “N/A”). Text scores are not supported yet.'],
  ['dupes', 'Duplicate (older copy)', 'The same evaluation (same values in the columns that identify it) appears more than once. Only the most recent copy is counted: the latest evaluation date up to today; with the same date, the lower row in the file. If they are really different evaluations, add a column to the key (e.g. ticket ID or evaluator).'],
  ['already', 'Already loaded from another source', 'The same evaluation is already loaded from another source (e.g. the same file registered twice or a copy). It is not loaded again.'],
];

/** Result of reading a file with a rule (wizard test, fix mapping test). Nothing is saved. */
function testBox(t) {
  if (!t.ok && t.needs) return `<div class="result err">✕ Columns still not found: ${t.needs.map(n => `tab “${esc(n.tab)}”: ${n.specs.map(x => '“' + esc(x) + '”').join(', ')}`).join(' · ')}</div>`;
  if (!t.ok) return `<div class="result err">✕ ${esc(t.error)}</div>`;

  const exTotal = excl.reduce((a, x) => a + x.n, 0);

      <div class="tbl-wrap" style="margin-bottom:10px"><table class="left wrap"><tr><th>Reason</th><th style="text-align:right">Rows</th><th>What it means · what to do</th><th>Examples in the file</th></tr>

/* ============================================================ FIX MAPPING */
function openFix(id) {
  const s = S.status.sources.find(x => x.id === id);
  if (!s || !s.mapping) return;
  const specs = [];
  s.mapping.tabs.forEach(t => t.specs.forEach(sp => { if (!specs.some(x => x.spec === sp)) specs.push({ spec: sp, headers: t.headers }); }));
  S.fix = { id: id, specs: specs, tabs: s.mapping.tabs, more: (s.mapping.count || 0) - s.mapping.tabs.length,
    renames: specs.map(x => bestMatch(x.spec, x.headers)), ignore: new Set(), test: null, testing: false };
  drawFix();
}
function fixChanges() {
  const f = S.fix;
  return { renames: f.specs.map((x, i) => ({ spec: x.spec, header: f.renames[i] })).filter(x => x.header), ignoreTabs: Array.from(f.ignore) };
}
function drawFix() {
  const f = S.fix;
  openModal(`<h2>Fix mapping · ${esc(f.id)}</h2>
    <p class="small">These columns were not found in the account file. Nothing new was loaded and <b>the data loaded before is kept</b>.
      Pick the column that now holds the same information. The old name is kept as an alternative, so older tabs keep working.</p>
    <div class="form">${f.specs.map((x, i) => `<label class="f">Column “${esc(x.spec.split('||').join('” or “'))}”</label>
      <select data-ren="${i}"><option value="">— choose the new column —</option>${x.headers.map(h => `<option ${h === f.renames[i] ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select>
      ${f.renames[i] && f.renames[i] === bestMatch(x.spec, x.headers) ? '<div class="sugg">✓ Suggested: closest name</div>' : ''}`).join('')}
    <label class="f">Tabs with the problem</label>
    ${f.tabs.map(t => `<label class="opt-line"><input type="checkbox" data-ign="${esc(t.tab)}" ${f.ignore.has(t.tab) ? 'checked' : ''}> “${esc(t.tab)}” is not an evaluations tab: ignore it</label>`).join('')}
    ${f.more > 0 ? `<p class="small muted">+ ${f.more} more tab(s) with the same problem.</p>` : ''}</div>
    ${f.testing ? '<div class="inline-load" style="margin-top:12px"><span class="spin"></span> Reading the file with the new mapping… nothing is saved yet.</div>' : ''}
    ${f.test ? testBox(f.test) : ''}
    <div class="nav-row"><button class="btn ghost" id="fx-cancel">Cancel</button><span>
      <button class="btn ghost" id="fx-test" ${f.testing ? 'disabled' : ''}>Test</button>
      <button class="btn" id="fx-save" ${f.test && f.test.ok && !f.testing ? '' : 'disabled'} title="Test first">Save and reload</button></span></div>
    <p class="small muted" style="margin-top:10px">No approval is needed for a renamed column. The change is versioned and the BA team is notified.</p>`);
  document.querySelectorAll('[data-ren]').forEach(sel => sel.onchange = () => { f.renames[+sel.dataset.ren] = sel.value; f.test = null; drawFix(); });
  document.querySelectorAll('[data-ign]').forEach(cb => cb.onchange = () => { cb.checked ? f.ignore.add(cb.dataset.ign) : f.ignore.delete(cb.dataset.ign); f.test = null; drawFix(); });
  document.getElementById('fx-cancel').onclick = closeModal;
  document.getElementById('fx-test').onclick = async () => {
    f.testing = true; f.test = null; drawFix();
    await withBusy(`Testing the new mapping of ${f.id}…`, false, async () => {
      try { f.test = await call('apiRemapTest', f.id, fixChanges()); } catch (e) { f.test = { ok: false, error: e.message }; }
    });
    f.testing = false; drawFix();
  };
  document.getElementById('fx-save').onclick = async () => {
    let res = null;
    await withBusy(`Saving the new mapping and reloading ${f.id}…`, true, async () => {
      try { res = await call('apiRemapSave', f.id, fixChanges()); } catch (e) { toast(e.message); }
      if (res) { busyMsg('Refreshing the totals…'); await loadStatus(); }
    });
    if (!res) return;
    closeModal();
    if (res.status === 'OK') toast(`✓ ${f.id}: mapping saved and ${N(res.loaded)} evaluations loaded.`, true);
    else toast(`${f.id}: ${res.message}`);
    if (S.view === 'status') renderStatus();
  };
}

      <div class="nav-row"><button class="btn ghost" id="a-back">${a.step ? '← Back' : 'Cancel'}</button>${a.step < 4 ? `<button class="btn" id="a-next" ${canNext(a) ? '' : 'disabled'}>Next →</button>` : sendButton(a)}</div></div>`;

function canNext(a) {
  const d = a.d;
  if (a.step === 0) return !!(a.file && a.file.ok);
  if (a.step === 1) return !!(a.insp && !a.insp.empty && a.tabs.size && !a.loadingTab && (!a.autoTabs || validPattern(a.tabPattern)));
  if (a.step === 2) return !!(d.account && d.country && d.lob);
  if (a.step === 3) {
    const score = d.scoreMode === 'one' ? d.scoreCol : d.scoreMode === 'two' ? d.earned && d.possible : d.num && d.den;
    return !!(d.date && d.wdid && score && d.keys.length && (d.scoreMode !== 'one' || scaleOf(d)));
  }
  return false;
}

/** Wildcard match of a tab name, same rule as the engine ("* 2026" = anything ending in " 2026"). */
function tabMatch(pat, name) {
  if (!pat.includes('*')) return pat.trim().toLowerCase() === String(name).trim().toLowerCase();
  return new RegExp('^' + pat.trim().split('*').map(x => x.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$', 'i').test(String(name).trim());
}
const validPattern = pat => /\*/.test(pat || '') && !/,/.test(pat) && String(pat).trim()[0] !== '-';

function suggestPattern(names) {
  if (names.length < 2) return '*';
  const sep = /[\s_\-.|]/;

  if (suf && !sep.test(suf[0])) { const k = suf.search(sep); suf = k >= 0 ? suf.slice(k) : ''; }
  if (suf.trim().length >= 2) return '*' + suf;
  let pre = names.reduce((x, n) => { let i = 0; while (i < x.length && i < n.length && x[i].toLowerCase() === n[i].toLowerCase()) i++; return x.slice(0, i); });
  if (pre && !sep.test(pre[pre.length - 1])) { let k = -1; for (let i = 0; i < pre.length; i++) if (sep.test(pre[i])) k = i; pre = k >= 0 ? pre.slice(0, k + 1) : ''; }

}

}

const SCALES = [['0-100', '0 to 100 (e.g. 92)'], ['0-1', '0 to 1, or a percentage (e.g. 0.92 or 92%)'], ['0-5', '0 to 5 (e.g. 4 = 80%)'],

/* ============================================================ REQUESTS */
const REQ_LABEL = { 'Access change': 'Access change', 'New tab': 'New tab found', 'Remove source': 'Source removed', Delete: 'Delete data', Replace: 'Reload a period', Modify: 'Change the calculation', 'New source': 'New source', 'Quick add': 'New link (Quick add)', Remap: 'Column renamed' };

async function renderRequests() {

function requestForm(q, srcs) {

  return `${types.map(t => `<div class="choice ${q.type === t[0] ? 'on' : ''}" data-rt="${t[0]}"><span class="dot"></span><div><b>${t[1]}</b><span class="muted small">${t[2]}</span></div></div>`).join('')}

      ${q.type !== 'Modify' ? `<div class="cols2" style="gap:0 10px"><div><label class="f">From</label><input type="date" id="r-from" value="${esc(q.from)}"></div><div><label class="f">To</label><input type="date" id="r-to" value="${esc(q.to)}"></div></div>` : '<div></div>'}</div>
    <label class="f">Reason</label><textarea id="r-why" placeholder="${q.type === 'Modify' ? 'e.g. We added a tab for Chat from October' : 'e.g. September includes test evaluations by mistake'}">${esc(q.reason)}</textarea>

    <div class="toolbar" style="margin-top:12px">${q.type !== 'Modify' ? '<button class="btn ghost" id="r-prev">Preview</button>' : ''}
      <button class="btn" id="r-send" ${(q.type === 'Modify' || q.preview) && !q.sending ? '' : 'disabled'} title="${q.type === 'Modify' ? '' : 'Preview first'}">Send request</button></div>`;

function bindRequestForm(q, srcs) {

  const f = document.getElementById('r-from'), t = document.getElementById('r-to');

  if (p) p.onclick = async () => {
    q.msg = '';

    q.previewing = true; renderRequests();
    await withBusy('Counting the evaluations in that period…', false, async () => {
      try { q.preview = await call('apiRequestPreview', { type: q.type, sourceId: q.source, from: q.from, to: q.to }); } catch (e) { q.msg = e.message; q.msgErr = true; }

      try {
        const r = await call('apiCreateRequest', { type: q.type, sourceId: q.source, from: q.from, to: q.to, reason: q.reason });

        q.preview = null; q.reason = '';
        await loadStatus();
      } catch (e) { q.msg = e.message; q.msgErr = true; }
    });
    q.sending = false; renderRequests(); window.scrollTo(0, 0);
  };
}
function reqDetails(r) {

  if (r.type === 'Quick add') return `<p>File <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.fileName)}</a>${d.country ? ` · ${esc(d.country)}` : ''}${d.note ? ` · note: “${esc(d.note)}”` : ''}</p>`;

}
const ACTION_BTN = { keep: ['Yes, it has evaluations', ''], exclude: ['Not evaluations: exclude it and reload', ''], run: [null, ''], load: ['Approve and load', ''], done: ['Mark as done', ''], map: ['Map the columns', ''], reject: ['Reject', 'danger'] };
function drawRequestLists(q) {

      <td>${r.from ? `${esc(r.from)} → ${esc(r.to)}` : '—'}</td><td>${r.rows === '' ? '—' : N(r.rows)}</td><td>${esc(r.at)}<span class="ev">${esc(r.by)}</span></td>
      <td>${reqPill(r.status)}${r.decidedBy ? `<span class="ev">${esc(r.decidedBy)} · ${esc(r.decidedAt)}</span>` : r.reviewedBy ? `<span class="ev">reviewed by ${esc(r.reviewedBy)}</span>` : ''}</td>
      <td class="small">${esc(r.result || (r.type === 'Remap' ? r.reason : '') || '—')}</td></tr>`).join('')}</table></div>` : '<div class="panel muted">No requests yet.</div>';

async function act(q, r, a) {
  if (a === 'map') {
    const d = r.details || {};
    S.add = newAdd(); Object.assign(S.add, { mode: 'map', url: d.url || '', fromRequest: r.id });
    S.add.d.account = r.account; if (d.country) { S.add.d.country = d.country; }
    go('add');
    document.getElementById('a-check').click();
    return;
  }
  if (a === 'reject' || a === 'done') {
    openModal(`<h2>${a === 'reject' ? 'Reject' : 'Mark as done'} · ${esc(r.id)}</h2><div class="form"><label class="f">${a === 'reject' ? 'Reason (sent to the requester)' : 'What was changed? (sent to the requester)'}</label>
      <textarea id="m-note" placeholder="${a === 'reject' ? 'e.g. Please correct the file first and then request a reload' : 'e.g. Added the Chat tab to the rule'}"></textarea></div>
      <div id="m-err"></div><div class="nav-row"><button class="btn ghost" id="m-cancel">Cancel</button><button class="btn ${a === 'reject' ? 'danger' : ''}" id="m-ok">${a === 'reject' ? 'Reject' : 'Mark as done'}</button></div>`);
    document.getElementById('m-cancel').onclick = closeModal;
    document.getElementById('m-ok').onclick = async () => {
      const note = document.getElementById('m-note').value.trim();
      if (a === 'reject' && !note) { document.getElementById('m-err').innerHTML = '<div class="err-box" style="margin-top:10px">Add a reason for the requester.</div>'; return; }
      closeModal();
      await decide(q, r, a, note);
    };
    return;
  }
  await decide(q, r, a, '');
}
async function decide(q, r, a, note) {
  const msg = { keep: `Confirming ${r.id}…`, exclude: `Excluding the tab and reloading ${r.sourceId} from the file… (15–75 s)`, load: `Creating the source and loading its 2026 evaluations… (15–75 s)`, done: `Closing ${r.id}…`, reject: `Rejecting ${r.id}…`,
    run: r.type === 'Delete' ? `Deleting ${N(r.rows)} evaluations of ${r.sourceId} and saving the 7-day backup…` : `Reloading ${r.sourceId} from the file… (15–75 s)` }[a];
  await withBusy(msg, true, async () => {
    try {
      const res = await call('apiDecide', r.id, a, note);
      q.msg = res.status === 'Rejected' ? `${r.id} rejected. The requester got an email with the reason.`
        : `✓ ${r.id} done${res.result ? ': ' + res.result : ''}.${String(r.by).includes('@') ? ' The requester got an email.' : ''}`;
      q.msgErr = false;
      busyMsg('Refreshing…');
      await loadStatus();
    } catch (e) { q.msg = e.message; q.msgErr = true; }
  });
  renderRequests(); window.scrollTo(0, 0);
}

        <td style="white-space:nowrap"><button class="btn ghost sm" data-uedit="${esc(u.email)}">Edit</button>
          ${u.email !== r.me ? `<button class="btn ghost sm" data-udel="${esc(u.email)}">Remove</button>` : '<span class="small muted">you</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nobody yet.</td></tr>'}</table></div>
      <p class="small muted" style="margin-top:10px">Changes apply the next time the person opens or reloads the portal. People who are not in the list: <b>${esc(r.unlistedRole)}</b>. Every change is recorded in Requests (“Access change”, Admins only). The same list is the <a href="${esc(r.url)}" target="_blank" rel="noopener">Access tab of the control sheet</a>.</p></div>
    <div class="panel"><h2>What each role can do</h2><div class="tbl-wrap"><table class="left wrap"><tr><th>Role</th><th>Sees</th><th>Can</th></tr>
      <tr><td>User</td><td>Status and Results of their accounts only</td><td>Add files, fix renamed columns, refresh their sources, request deletions, reloads and changes</td></tr>
      <tr><td>Admin (BA team)</td><td>Everything</td><td>Approve every request and new source, manage and remove data, edit rules, manage access</td></tr></table></div></div>`;
  document.getElementById('acc-add').onclick = () => editUser(null);
  box.querySelectorAll('[data-uedit]').forEach(b => b.onclick = () => editUser(r.users.find(u => u.email === b.dataset.uedit)));
  box.querySelectorAll('[data-udel]').forEach(b => b.onclick = () => removeUser(b.dataset.udel));
}
/** Add (u = null) or edit a person: role, accounts (User only) and request emails. */
function editUser(u) {
  const r = S.acc;
  const f = u ? { email: u.email, name: u.name, role: u.role, all: u.all, accounts: u.accounts.slice(), alerts: u.alerts }
    : { email: '', name: '', role: 'User', all: false, accounts: [], alerts: false };
  const known = r.allAccounts;
  const draw = () => {
    const extra = f.accounts.filter(a => !known.includes(a));
    openModal(`<h2>${u ? 'Edit ' + esc(u.name || u.email) : 'Add a person'}</h2><div class="form">
      <div class="cols2"><div><label class="f">Email</label><input type="text" id="u-email" value="${esc(f.email)}" ${u ? 'disabled' : ''} placeholder="name@example.com"></div>
        <div><label class="f">Name <span class="hint">optional</span></label><input type="text" id="u-name" value="${esc(f.name)}"></div></div>
      <label class="f">Role</label>
      <span class="seg"><button data-urole="User" class="${f.role === 'User' ? 'on' : ''}">User</button><button data-urole="Admin" class="${f.role === 'Admin' ? 'on' : ''}">Admin</button></span>
      ${f.role === 'User' ? `<label class="f">Accounts this person can see</label>
        <label class="opt-line"><input type="checkbox" id="u-all" ${f.all ? 'checked' : ''}> <b>All accounts</b></label>
        ${f.all ? '' : `<div class="tabpick" style="margin-top:4px">${known.map(a => `<label class="opt-line"><input type="checkbox" data-uacc="${esc(a)}" ${f.accounts.includes(a) ? 'checked' : ''}> ${esc(a)}</label>`).join('')}</div>
          <label class="f">Other accounts <span class="hint">not loaded yet; same name as in the master list, separated by commas</span></label>
          <input type="text" id="u-extra" value="${esc(extra.join(', '))}" placeholder="e.g. Acme">`}`
        : '<p class="small muted" style="margin-top:8px">An Admin sees all accounts and approves every request.</p>'}
      <label class="opt-line" style="margin-top:14px"><input type="checkbox" id="u-alerts" ${f.alerts ? 'checked' : ''}> Gets the request emails (new files, deletions, reloads, new tabs)</label></div>
      <div id="u-err"></div>
      <div class="nav-row"><button class="btn ghost" id="u-cancel">Cancel</button><button class="btn" id="u-save">${u ? 'Save changes' : 'Add person'}</button></div>`);
    const keep = () => {
      if (!u) f.email = document.getElementById('u-email').value.trim();
      f.name = document.getElementById('u-name').value.trim();
      f.alerts = document.getElementById('u-alerts').checked;
      const all = document.getElementById('u-all'); if (all) f.all = all.checked;
      if (document.querySelector('[data-uacc]') || document.getElementById('u-extra')) {
        const ticked = Array.from(document.querySelectorAll('[data-uacc]:checked')).map(c => c.dataset.uacc);
        const ex = document.getElementById('u-extra');
        f.accounts = ticked.concat(ex ? ex.value.split(',').map(x => x.trim()).filter(Boolean) : []);
      }
    };
    document.querySelectorAll('[data-urole]').forEach(b => b.onclick = () => { keep(); f.role = b.dataset.urole; draw(); });
    const all = document.getElementById('u-all'); if (all) all.onchange = () => { keep(); draw(); };
    document.getElementById('u-cancel').onclick = closeModal;
    document.getElementById('u-save').onclick = async () => {
      keep();
      const err = document.getElementById('u-err');
      if (!f.email) { err.innerHTML = '<div class="err-box" style="margin-top:10px">Write the email.</div>'; return; }
      if (f.role === 'User' && !f.all && !f.accounts.length) { err.innerHTML = '<div class="err-box" style="margin-top:10px">Choose at least one account, or All accounts.</div>'; return; }
      closeModal();
      await withBusy(`${u ? 'Saving' : 'Adding'} ${f.email}…`, true, async () => {
        try {
          S.acc = await call('apiSaveUser', f);
          S.accMsg = `✓ ${f.email} ${u ? 'updated' : 'added'}: ${f.role}${f.role === 'User' ? ' · ' + (f.all ? 'all accounts' : f.accounts.join(', ')) : ''}.`; S.accMsgErr = false;
          await loadStatus();
        } catch (e) { S.accMsg = e.message; S.accMsgErr = true; }
      });
      drawAccess(); window.scrollTo(0, 0);
    };
  };
  draw();
}
function removeUser(email) {
  openModal(`<h2>Remove ${esc(email)}?</h2><p class="small">This person will no longer be able to open the portal. Their past requests and loads stay in the history.</p>
    <div class="nav-row"><button class="btn ghost" id="ud-cancel">Cancel</button><button class="btn danger" id="ud-ok">Remove</button></div>`);
  document.getElementById('ud-cancel').onclick = closeModal;
  document.getElementById('ud-ok').onclick = async () => {
    closeModal();
    await withBusy(`Removing ${email}…`, true, async () => {
      try { S.acc = await call('apiRemoveUser', email); S.accMsg = `✓ ${email} removed.`; S.accMsgErr = false; }
      catch (e) { S.accMsg = e.message; S.accMsgErr = true; }
    });
    drawAccess(); window.scrollTo(0, 0);
  };
}

/* ============================================================ start */
/** ?view=requests in the link (used by the emails) opens that page. */
function startView() {
  return new Promise(res => {
    try { google.script.url.getLocation(l => res((l && l.parameter && l.parameter.view) || '')); }
    catch (e) { res(String(location.hash || '').slice(1)); }
  });
}
(async () => {
  busyStart('Loading the portal…', false);
  try { await loadStatus(); } finally { busyEnd(); }
  go(await startView());
  if (S.status) ensureDataset().catch(() => {});   // preload in the background: Results opens instantly
})();
</script>
